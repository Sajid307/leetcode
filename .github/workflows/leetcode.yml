name: LeetCode Daily Update

on:
  workflow_dispatch:

  schedule:
    - cron: "30 18 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create profile directory
        run: |
          mkdir -p profile

      - name: Update LeetCode data
        run: |
          python scripts/update_leetcode.py

      - name: Calculate streak
        run: |
          python scripts/generate_stats.py

      - name: Generate LeetCode card
        run: |
          python scripts/generate_card.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add stats.json activity.json streak.json profile/leetcode.svg

          git diff --cached --quiet || \
            git commit -m "chore: update LeetCode progress"

          git push
