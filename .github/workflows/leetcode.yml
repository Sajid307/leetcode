name: LeetCode Daily Update

on:
  workflow_dispatch:

  schedule:
    - cron: "30 18 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create directories
        run: |
          mkdir -p profile
          mkdir -p logs

      - name: Fetch LeetCode data
        run: |
          python scripts/update_leetcode.py

      - name: Calculate streak
        run: |
          python scripts/generate_stats.py

      - name: Generate statistics card
        run: |
          python scripts/generate_card.py

      - name: Generate heatmap
        run: |
          python scripts/generate_heatmap.py

      - name: Generate recent problems
        run: |
          python scripts/generate_dashboard.py

      - name: Generate daily log
        run: |
          python scripts/generate_daily_log.py

      - name: Generate dynamic metrics
        run: |
          python scripts/generate_metrics.py

      - name: Commit LeetCode progress
        run: |

          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            stats.json \
            activity.json \
            streak.json \
            calendar.json \
            profile/ \
            logs/

          git diff --cached --quiet || \
            git commit \
            -m "🧩 LeetCode: daily progress $(date -u +%Y-%m-%d)"

          git push
