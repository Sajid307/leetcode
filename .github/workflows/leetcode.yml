name: LeetCode Daily Update

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Test workflow
        run: |
          echo "LeetCode automation is working!"
          echo "LeetCode Username: Sajid-307"

      - name: Update timestamp
        run: |
          echo "Last workflow execution: $(date -u)" > workflow-test.txt

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add workflow-test.txt

          git diff --cached --quiet || git commit -m "chore: update LeetCode activity"

          git push
